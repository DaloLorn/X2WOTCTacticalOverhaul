[LWotCArmorMatters.X2DLCInfo_LWotCArmorMatters]

;Enable logging here. Only do this if you are troubleshooting
bEnableLog = false

; **********************
; *** ABLATIVE ARMOR ***
; **********************

; Enable Ablative Armor.
bEnableAblativeArmor = true

;This config makes it so that you get additional ablative points on top of the armor's original HP. 
;For example: if iAdditionalAblative = 1, and the armor has +1 HP, it will end up with +2 Ablative
; Note that unlike WOTC_AblativeToVest, LWotCArmorMatters applies this even for armors with +0 HP!
iAdditionalAblative = 1

;This is only meant for Beta Strike. If you use Beta Strike second wave option, please update this to 2
; Note that unlike WOTC_AblativeToVest, LWotCArmorMatters also applies this to the value from `iAdditionalAblative`!
iAblativeMultiplier = 1

;This config makes it so that the mod does not replace +HP with +Ablative. The mod will add
;+Ablative and leave +HP intact on the armors. This makes soldiers a lot tankier.
bStripArmorHP = true

; ***********************
; *** ARMORED PLATING ***
; ***********************

; Enable Armored Plating.
bEnableArmoredPlating = true

; This flag strips ablative HP from all platings via OPTC.
; The reason I'm not using LWotC's built-in ablative HP configs
; to zero them out is that I want bEnableArmoredPlating to *completely* disable
; the Armored Plating module, which means I'm not allowed to have AP configs
; in the LWotC namespace.
bStripAblativePlating = true

; Contains a list of all plating abilities to target.
; This serves two purposes:
; - Making it easier to make an LW2 Utility Platings compatibility patch
;   for Armored Plating.
; - Allowing compatibility with custom plating abilities, should a mod
;   ever add those. (Most mods I'm aware of just reuse the LWotC abilities.)
+CERAMIC_PLATING_ABILITIES=Ceramic_Plating_Ability
+CERAMIC_PLATING_ABILITIES=LW2WOTC_CeramicPlating_Ability
+ALLOY_PLATING_ABILITIES=Alloy_Plating_Ability
+ALLOY_PLATING_ABILITIES=LW2WOTC_AlloyPlating_Ability
+CHITIN_PLATING_ABILITIES=Chitin_Plating_Ability
+CHITIN_PLATING_ABILITIES=LW2WOTC_ChitinPlating_Ability
+CARAPACE_PLATING_ABILITIES=Carapace_Plating_Ability
+CARAPACE_PLATING_ABILITIES=LW2WOTC_CarapacePlating_Ability

; SPARKs are exempt for now, since their plating doesn't give ablative HP in 1.2.2
; but 1.2.3 overhauls SPARK armors extensively. They can equip regular platings, anyway...
;+SPARK_KEVLAR_PLATING_ABILITIES=SPARK_Kevlar_Plating_Ability
;+SPARK_PLATED_PLATING_ABILITIES=SPARK_Plated_Plating_Ability
;+SPARK_POWERED_PLATING_ABILITIES=SPARK_Powered_Plating_Ability

; Registering custom platings requires a slightly different system.
; We don't have a predetermined config key for their armor value,
; so we should use a dictionary (of sorts) instead of an array.
; +CUSTOM_PLATING_ABILITIES=(Name = MySuperPlatingAbility, Armor = 5)

; These configs determine how many points of armor a given plating type should give.
; Custom platings use a struct instead, see above example.
CERAMIC_PLATING_ARMOR=1
ALLOY_PLATING_ARMOR=2
CHITIN_PLATING_ARMOR=3
CARAPACE_PLATING_ARMOR=4

SPARK_KEVLAR_PLATING_ARMOR=0
SPARK_PLATED_PLATING_ARMOR=0
SPARK_POWERED_PLATING_ARMOR=0

; **********************
; *** COVER DR REDUX ***
; **********************
[LWotCArmorMatters.Helpers_CoverDR]
; I originally wrote this entire module as a Highlander submission, so there's
; a lot of stylistic differences from the rest of the mod (on account of it being
; a loosely-styled amalgamation of copy-pasta and my own default style, 
; as opposed to the Highlander's strict contributor guidelines).
;
; Alas, if there's any kind of linter for XCOM 2 mods, I've not heard of it,
; and I haven't cared to go refactoring all the bits and pieces I've done "wrong".
; Bear with me. Or submit PRs whenever I get around to pushing my local repo to GitHub.

; Enable logging for this module.
ENABLE_LOGGING=true

; Toggles the cover DR system on and off.
; For more granular control, this does *not* supersede COVER_NO_DEFENSE_IN_MIN_RANGE,
; so you can still allow close-range attacks to receive flanking bonuses (see below).
COVER_DR_ENABLED=true

; If set to true, armor piercing will not apply to cover DR.
; Attacks that ignore armor will still ignore cover DR, though.
;COVER_DR_IMPENETRABLE=true

; These flags control cover DR's interactions with explosions
; (read: AoEs emanating from any location other than the attacker's location).
; Setting the first flag to true will prevent cover DR against explosions.
; Otherwise, setting the second flag to true will make it calculate cover against
; the attacker's location, instead of the center of the explosion.
; Note that these flags currently do not interact with the 
; COVER_DR_MIN_RANGE variables in any way.
;COVER_DR_IGNORES_EXPLOSIONS=true
;COVER_DR_CALCULATES_EXPLOSIONS_FROM_ATTACKER=true

; If set to true, cover DR will also apply to melee attacks.
; The interactions between cover math and melee are not fully understood by the author,
; so the results might not make sense.
;COVER_DR_AFFECTS_MELEE=true 

; If set to true, getting close enough to a covered unit will negate cover.
; This is controlled by the COVER_DR_MIN_RANGE variables below.
; Negating cover in this fashion will prevent it from granting defense bonuses,
; and give the attacker the same crit chance bonus as if they had flanked the target.
; This also affects abilities such as Hunter's Instincts.
COVER_NO_DEFENSE_IN_MIN_RANGE=true

; How much flat DR is added by a given cover level?
; Fractional DR represents a percentile chance of blocking an extra point of damage.
; Example: 2.2 DR would always block 2 damage, and have a 20% chance of blocking 3 damage instead.
;COVER_DR_FLAT_LOW=0.0
;COVER_DR_FLAT_HIGH=0.0

; How much of the attacker's damage will a given cover level add to DR?
; Expected values are in the 0-1 range, representing 0-100% of incoming damage.
; Values outside that range may result in unintended behavior.
; This percentage is calculated before armor DR is applied, and is therefore
; not reduced by armor.
; If combined with flat DR, the two values will be summed up before fractional DR
; is evaluated.
;
; Example: 
;   30% of an attack dealing 2 damage will result in
;   0.6 DR, and therefore a 60% chance of blocking 1 damage.
;   If flat DR were set to 1.5, the resulting DR would be 2.1.
COVER_DR_PERCENT_LOW=0.3
COVER_DR_PERCENT_HIGH=0.5

; How much total damage can a given cover level absorb from a single attack?
; (If you don't want to see things like potted plants fully blocking a Beam Cannon.)
; This applies after all cover DR has been summed up, but before fractional DR.
; Example: 
;   Capping DR at 2.5 will prevent cover from blocking more than 3 damage,
;   and only allow a 50% chance of blocking more than 2 damage.
COVER_DR_MAX_LOW=8.0
COVER_DR_MAX_HIGH=16.0

; Controls whether cover can be bypassed by getting close enough to the target.
; Attacks coming from no more than X tiles will not be subject to cover DR.
; A minimum cover range of less than 1 tile means cover DR will always apply.
COVER_DR_MIN_RANGE_LOW=2
COVER_DR_MIN_RANGE_HIGH=1

; Hunkering down increases cover DR by how much? (Expressed as a percentage of normal DR.)
; This stacks additively with any other perk/effect multipliers
; (such as Surgical Precision's -50% cover bonus),
; and like them, it applies after the DR cap and before fractional DR.
; Example:
;   If cover would block 2.5 damage from an attack, and HUNKER_DR_MODIFIER is 0.5,
;   it will block 2.5*1.5=3.75 damage if the victim is hunkering.
;   If the attack benefited from Surgical Precision, the two modifiers would cancel out.
HUNKER_DR_MODIFIER=0.5

; Being unflankable is equivalent to which level of cover?
; (This is a kludge so you don't *have* to OPTC extra armor into every unflankable unit.
; But please, don't ever use it.)
; Possible options are CT_None, CT_MidLevel (low), or CT_Standing (high).
;COVER_DR_UNFLANKABLE_COVER_LEVEL=CT_MidLevel

; Include net armor/cover DR in damage previews?
; Note that cover bonuses (if any) will appear as an extra damage flyover
; regardless of this setting.
PREVIEW_ARMOR_MITIGATION=true

; ***********************
; *** DAMAGE OVERHAUL ***
; ***********************

[LWotCArmorMatters.X2EventListener_DamageOverhaul]
; Enable logging for this module.
ENABLE_LOGGING=true

; Toggles the Damage Overhaul module on and off.
DAMAGE_OVERHAUL_ENABLED=true

; All damage with these damage types, regardless of source, should
; ignore armor (and armor-like, e.g. cover DR) mitigation
; to deal full damage. 
; Note that this only checks the primary damage type,
; and will not be affected by bonus damage from ammo.
; Additionally, some effects may reduce damage directly,
; and are not subject to armor reductions.
+DAMAGE_IGNORES_ARMOR="Projectile_BeamAvatar" # Avatar weapons!
+DAMAGE_IGNORES_ARMOR="Bleeding"
+DAMAGE_IGNORES_ARMOR="bleeding"
+DAMAGE_IGNORES_ARMOR="Poison"
+DAMAGE_IGNORES_ARMOR="Psi"
+DAMAGE_IGNORES_ARMOR="psi"
+DAMAGE_IGNORES_ARMOR="Psionic"
+DAMAGE_IGNORES_ARMOR="EleriumPoisoning"
+DAMAGE_IGNORES_ARMOR="Mental"

; As DAMAGE_IGNORES_ARMOR, but this flag controls
; interactions with ablative HP, instead.
+DAMAGE_IGNORES_ABLATIVE="Projectile_BeamAvatar" # Avatar weapons!
+DAMAGE_IGNORES_ABLATIVE="Bleeding"
+DAMAGE_IGNORES_ABLATIVE="bleeding"
+DAMAGE_IGNORES_ABLATIVE="Frost"
+DAMAGE_IGNORES_ABLATIVE="frost"
+DAMAGE_IGNORES_ABLATIVE="Poison"
+DAMAGE_IGNORES_ABLATIVE="Psi"
+DAMAGE_IGNORES_ABLATIVE="psi"
+DAMAGE_IGNORES_ABLATIVE="Fire"
+DAMAGE_IGNORES_ABLATIVE="fire"
+DAMAGE_IGNORES_ABLATIVE="Napalm"
+DAMAGE_IGNORES_ABLATIVE="Electrical"
+DAMAGE_IGNORES_ABLATIVE="EleriumPoisoning"
+DAMAGE_IGNORES_ABLATIVE="Radiation"
+DAMAGE_IGNORES_ABLATIVE="Mental"
+DAMAGE_IGNORES_ABLATIVE="Psionic"
+DAMAGE_IGNORES_ABLATIVE="AHWStrangle"
+DAMAGE_IGNORES_ABLATIVE="ViperCrush"

; Damage types to ignore when checking "primary damage" for the above flags.
; This wouldn't be necessary if ammo didn't change the weapon's damage type...
+IRRELEVANT_DAMAGE_TYPES="Melee"
; TODO: Confirm that ignoring None does not have any unwanted side effects.
+IRRELEVANT_DAMAGE_TYPES="None"

; Converts certain weapons to use other damage types.
+WEAPON_DAMAGE_SWAP=(Name = "Weapon_AshXcomPsionicReaper", Type = "Projectile_BeamAvatar")
+WEAPON_DAMAGE_SWAP=(Name = "PA_ViperCommandoWarpRifle", Type = "Projectile_BeamAvatar")
+WEAPON_DAMAGE_SWAP=(Name = "AHWTeslaRifle", Type = "Electrical")
+WEAPON_DAMAGE_SWAP=(Name = "AHWTeslaRifleT2", Type = "Electrical")
+WEAPON_DAMAGE_SWAP=(Name = "AHWTeslaRifleT3", Type = "Electrical")

; Makes DoTs with a given damage type always tick at a certain time,
; regardless of the original effect definition. This may inadvertently
; also change the duration of the DoT.
; Generally, any defense-ignoring DoT ticks on turn end, to 
; ensure the owner has a chance to dispel it (usually by healing).
+CHANGE_DOT_SCHEDULES=(DamageType = "Bleeding", Schedule = eGameRule_PlayerTurnEnd)
+CHANGE_DOT_SCHEDULES=(DamageType = "Poison", Schedule = eGameRule_PlayerTurnEnd)
+CHANGE_DOT_SCHEDULES=(DamageType = "Psi", Schedule = eGameRule_PlayerTurnEnd)
+CHANGE_DOT_SCHEDULES=(DamageType = "EleriumPoisoning", Schedule = eGameRule_PlayerTurnEnd)
+CHANGE_DOT_SCHEDULES=(DamageType = "Fire", Schedule = eGameRule_PlayerTurnEnd)
+CHANGE_DOT_SCHEDULES=(DamageType = "Napalm", Schedule = eGameRule_PlayerTurnEnd)
+CHANGE_DOT_SCHEDULES=(DamageType = "Radiation", Schedule = eGameRule_PlayerTurnEnd)
+CHANGE_DOT_SCHEDULES=(DamageType = "Electrical", Schedule = eGameRule_PlayerTurnEnd)
+CHANGE_DOT_SCHEDULES=(DamageType = "Frost", Schedule = eGameRule_PlayerTurnEnd)
+CHANGE_DOT_SCHEDULES=(DamageType = "Psionic", Schedule = eGameRule_PlayerTurnEnd)

